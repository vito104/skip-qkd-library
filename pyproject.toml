[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skip-qkd"
version = "1.0.0"
description = "Python client library for SKIP (Secure Key Integration Protocol)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vit Ruzicka", email = "xruzicv00@vutbr.cz"}
]
keywords = ["skip", "qkd", "quantum", "cryptography", "key-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",  # ← Přidej toto
    "Programming Language :: Python :: 3",  # ← A toto (bez verze)
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "sslpsk3>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
"Homepage" = "https://github.com/vito104/skip-qkd-library"
"Repository" = "https://github.com/vito104/skip-qkd-library.git"
"Documentation" = "https://github.com/vito104/skip-qkd-library#readme"
"Bug Tracker" = "https://github.com/vito104/skip-qkd-library/issues"

[tool.setuptools.packages.find]
where = ["src"]